name: Build and release Linux AArch64 Platform-Tools

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: ./scripts/resolute-install-deps.sh
      - name: Build
        env:
          JOBS: 4
        run: ./scripts/resolute-local-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: platform-tools-linux-aarch64
          path: |
            dist/platform-tools_r37.0.1-linux.zip
            dist/platform-tools_r37.0.1-linux.zip.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes --verify-tag
