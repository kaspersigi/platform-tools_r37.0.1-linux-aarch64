name: Build and release Linux AArch64 Platform-Tools

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate package
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Ubuntu 26.04 dependencies
        run: ./scripts/resolute-install-deps.sh
      - name: Build, validate, and package
        env:
          JOBS: "4"
        run: ./scripts/resolute-local-build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-tools-linux-aarch64
          path: |
            dist/platform-tools_r37.0.1-linux.zip
            dist/platform-tools_r37.0.1-linux.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: platform-tools-linux-aarch64
          path: dist
      - name: Verify release assets
        run: |
          cd dist
          sha256sum --check platform-tools_r37.0.1-linux.zip.sha256
          unzip -tq platform-tools_r37.0.1-linux.zip
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            dist/platform-tools_r37.0.1-linux.zip
            dist/platform-tools_r37.0.1-linux.zip.sha256
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}" \
              "${assets[@]}"
          fi
